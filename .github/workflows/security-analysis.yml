name: Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout du code
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8

      # 3. Debug requirements file
      - name: Debug requirements file
        run: cat requirements.txt

      # 4. Installer les dépendances
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 5. Analyse avec PyRaider
      - name: Run PyRaider
        run: |
          pip install pyraider
          pyraider check -f requirements.txt -e html pyraider-report.html -s high

      # 6. Collecter le rapport de PyRaider
      - name: Upload PyRaider Report
        uses: actions/upload-artifact@v2
        with:
          name: pyraider-report
          path: pyraider-report.html

      # 7. Installer Snyk
      - name: Install Snyk CLI
        run: |
          npm install -g snyk

      # 8. Authentification avec Snyk
      - name: Authenticate with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      # 9. Analyse avec Snyk
      - name: Run Snyk Security Analysis
        run: snyk test
